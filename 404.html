<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#ffffff">
  <title>404 | A bad roll. DICE LABS</title>
  <link rel="icon" type="image/png" href="/images/logo-blanco.png?v=20260902">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:400,700,900&amp;display=swap">
  <link rel="stylesheet" href="/assets/css/not-found.css?v=20261103">
  <script src="/assets/js/not-found.js?v=20261103" defer></script>
</head>
<body>
  <div class="backdrop" aria-hidden="true"></div>
  <div class="page">
    <header class="masthead">
      <a class="brand" href="/" aria-label="DICE LABS home">DICE LABS<span class="brand-dot" aria-hidden="true"></span></a>
      <span class="motto">Keep rolling</span>
    </header>

    <main>
      <div class="error-number" aria-hidden="true">404<span class="period">.</span></div>
      <p class="eyebrow">Error 404 / Page not found</p>
      <h1>Well, this is<br>a bad roll.</h1>
      <p class="explanation">This page rolled off the table.<br>Let's get you back in the game.</p>
      <nav class="actions" aria-label="Find your way back">
        <a class="action action-primary" href="/">Back to home <span aria-hidden="true">&nearr;</span></a>
        <a class="action action-secondary" href="/apps/">Explore apps <span aria-hidden="true">&rarr;</span></a>
      </nav>
      <div class="little-game" hidden>
        <button class="roll" type="button" aria-label="Roll a die for fun">
          <span class="die" data-value="4" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>
          <span>Try your luck</span>
        </button>
        <p class="roll-result" role="status" aria-live="polite" aria-atomic="true">Six sides. Still no page.</p>
      </div>
    </main>

    <footer><span>&copy; DICE LABS.</span><span>A little lost. Still rolling.</span></footer>
  </div>
</body>
</html>
