<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Play the Sliding Tiles Puzzle web demo by Dice Labs.">
  <title>Sliding Tiles Puzzle · Dice Labs</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #07110f; color: #fbfbf7; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(circle at 80% 12%, #129c90 0, transparent 32%), radial-gradient(circle at 16% 80%, #7461b9 0, transparent 30%), #07110f; }
    main { width: min(92vw, 760px); padding: 48px 24px; text-align: center; }
    .brand { color: #9fe8d8; letter-spacing: .12em; text-transform: uppercase; font-weight: 750; font-size: .8rem; }
    h1 { font-size: clamp(2.6rem, 9vw, 5.8rem); line-height: .95; margin: .7rem 0 1.3rem; }
    p { color: #d0ddd9; line-height: 1.6; max-width: 570px; margin: 0 auto; }
    .actions { display: flex; justify-content: center; flex-wrap: wrap; gap: 12px; margin-top: 2rem; }
    a { padding: 13px 22px; border: 1px solid #87dac9; border-radius: 999px; color: #07110f; background: #9fe8d8; text-decoration: none; font-weight: 750; }
    a.secondary { background: rgba(0,0,0,.24); color: #e7f3ef; border-color: #5b8f84; }
  </style>
</head>
<body>
  <main>
    <div class="brand">Dice Labs presents</div>
    <h1>Sliding Tiles<br>Puzzle</h1>
    <p>Rearrange each image, experiment with board modifiers and find your own route back to the solved board.</p>
    <div class="actions">
      <a href="demo/">Play the web demo</a>
      <a class="secondary" href="privacy/">Privacy</a>
    </div>
  </main>
</body>
</html>
